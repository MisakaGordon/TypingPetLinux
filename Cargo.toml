[workspace]
resolver = "2"
members = [
    "crates/typingpet-core",
    "crates/typingpet-input",
    "crates/typingpet",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
